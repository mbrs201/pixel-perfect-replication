name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Finds the folder that actually contains index.html.
      # If none has one, the build is not in static/SPA mode yet and we fail loudly.
      - name: Locate build output
        id: out
        run: |
          for d in .output/public dist/client dist; do
            if [ -f "$d/index.html" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              echo "Using output folder: $d"
              exit 0
            fi
          done
          echo "::error::No index.html found after build. Enable TanStack Start SPA mode in vite.config.ts."
          ls -R .output dist 2>/dev/null | head -60 || true
          exit 1

      # Lets direct links and page refreshes work on GitHub Pages
      - name: SPA fallback
        run: cp "${{ steps.out.outputs.dir }}/index.html" "${{ steps.out.outputs.dir }}/404.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
